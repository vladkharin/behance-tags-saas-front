name: Frontend CI/CD & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🛠️ Build, Test & SEO Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Regression Tests
        run: npm test -- --reporter=dot

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🔎 Verify Prerendered SEO Pages
        run: npm run check:seo

  deploy-to-server:
    name: 🚀 Deploy Frontend to VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📡 SSH Remote Deploy
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          umask 077
          key="$RUNNER_TEMP/beranked-deploy-key"
          hosts="$RUNNER_TEMP/beranked-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' '185.46.11.122 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFfG9qStVh5cX5Zjrt5kpcJM+mzvke1UKOKvkNVzSGpo' > "$hosts"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=30 vladkharin@185.46.11.122 deploy-beranked-frontend
