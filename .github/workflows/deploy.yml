name: Frontend CI/CD & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🛠️ Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

  deploy-to-server:
    name: 🚀 Deploy Frontend to VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📡 SSH Remote Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Starting deployment of BeRanked Frontend..."
            cd ~/projects/behance-tags-saas-front || exit 1
            git fetch --all
            git reset --hard origin/main
            echo "📦 Installing dependencies & building frontend..."
            npm ci
            npm run build
            echo "🔄 Reloading web server if needed..."
            # Если раздача идет через systemd/nginx/caddy:
            sudo systemctl reload nginx 2>/dev/null || sudo systemctl reload caddy 2>/dev/null || true
            echo "✅ Frontend deployment finished successfully!"
